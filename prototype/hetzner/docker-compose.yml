# Throwaway local stand-in for the Hetzner / Postgres pathway.
# Do not point this at production, Vercel, or the real Hetzner host.

name: talon-hetzner-prototype

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: talon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-talon_dev_only}
      POSTGRES_DB: talon_prototype
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/010_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talon -d talon_prototype"]
      interval: 2s
      timeout: 3s
      retries: 30

  auth:
    build:
      context: .
      dockerfile: auth/Dockerfile
    environment:
      ISSUER: http://localhost:5556
      PORT: "5556"
    ports:
      - "127.0.0.1:5556:5556"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5556/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      PORT: "8787"
      DATABASE_URL: postgres://talon_app:talon_app_dev_only@postgres:5432/talon_prototype
      OIDC_ISSUER: http://localhost:5556
      OIDC_JWKS_URL: http://auth:5556/jwks
      OIDC_AUDIENCE: talon-api
      PROTOTYPE_DEV: "1"
      BLOB_DIR: /data/blobs
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - blobs:/data/blobs
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
  blobs:
